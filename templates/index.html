<!DOCTYPE html>
<html>
<head>
    <title>FitBuddy - AI Fitness Planner</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: Arial; background: #f4f6f9; padding: 20px; }
        .box { max-width: 600px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2e7d32; }
        input, select, button { width: 100%; padding: 10px; margin: 8px 0; border-radius: 8px; border: 1px solid #ccc; }
        button { background: #2e7d32; color: white; font-weight: bold; cursor: pointer; border: none; }
        button:hover { background: #1b5e20; }
        #result { white-space: pre-wrap; margin-top: 20px; background: #e8f5e9; padding: 15px; border-radius: 8px; display: none; }
    </style>
</head>
<body>
<div class="box">
    <h1>FitBuddy 💪</h1>
    <p>AI Fitness Plan Generator using Gemini</p>
    <input type="number" id="age" placeholder="Age (e.g. 20)">
    <select id="gender"><option>Male</option><option>Female</option><option>Other</option></select>
    <input type="number" id="weight" placeholder="Weight in kg (e.g. 65)">
    <input type="number" id="height" placeholder="Height in cm (e.g. 172)">
    <select id="goal"><option>Weight Loss</option><option>Muscle Gain</option><option>Stay Fit</option></select>
    <select id="activity"><option>Sedentary</option><option>Lightly Active</option><option>Highly Active</option></select>
    <button onclick="generatePlan()">Generate My Plan</button>
    <div id="result"></div>
</div>

<script>
async function generatePlan(){
    const resultDiv = document.getElementById('result');
    resultDiv.style.display = 'block';
    resultDiv.innerText = 'Generating your plan... Please wait...';

    const data = {
        age: document.getElementById('age').value,
        gender: document.getElementById('gender').value,
        weight: document.getElementById('weight').value,
        height: document.getElementById('height').value,
        goal: document.getElementById('goal').value,
        activity: document.getElementById('activity').value
    };

    const res = await fetch('/generate', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
    });
    const json = await res.json();
    resultDiv.innerText = json.plan || json.error;
}
</script>
</body>
</html>
